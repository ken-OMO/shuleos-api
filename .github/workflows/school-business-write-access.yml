name: School business write verification
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: ['hardening/school-business-write-access']
permissions:
  contents: read
concurrency:
  group: school-business-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  postgres-business:
    name: PostgreSQL business writes (${{ matrix.state }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        state: [fresh, existing]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shuleos
          POSTGRES_PASSWORD: shuleos
          POSTGRES_DB: shuleos_assessment_fk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U shuleos -d shuleos_assessment_fk_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: shuleos_assessment_fk_test
      DB_USERNAME: shuleos
      DB_PASSWORD: shuleos
      DB_URL: ''
      DATABASE_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BOARDING_REPORTING_SCHEDULER_ENABLED: 'false'
      TRANSPORT_REPORTING_SCHEDULER_ENABLED: 'false'
      STUDENT_ELECTION_STATIONS_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pgsql, pdo_pgsql, gd
          coverage: none
          ini-values: memory_limit=1G
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
      - name: Fresh schema with business write boundary
        if: matrix.state == 'fresh'
        run: php artisan migrate --force
      - name: Upgrade existing schema without granting subscriptions
        if: matrix.state == 'existing'
        run: |
          mv database/migrations/2026_11_15_210000_serialize_main_subscription_changes.php /tmp/school-business-serialization.php
          php artisan migrate --force
          php tests/Support/SchoolBusinessUpgradeProbe.php prepare
          mv /tmp/school-business-serialization.php database/migrations/2026_11_15_210000_serialize_main_subscription_changes.php
          php artisan migrate --force
          php tests/Support/SchoolBusinessUpgradeProbe.php verify
      - name: Lint and check changed PHP formatting
        run: |
          php -l app/Services/School/SchoolBusinessWriteAccess.php
          php -l tests/Support/school_business_concurrency_worker.php
          vendor/bin/pint --test app/Services/School/SchoolBusinessWriteAccess.php app/Http/Middleware/ModulePermissionMiddleware.php database/migrations/2026_11_15_210000_serialize_main_subscription_changes.php tests/Feature/SchoolBusinessWriteAccessTest.php tests/Feature/SchoolBusinessWriteConcurrencyTest.php tests/Support/SchoolBusinessConcurrencyRunner.php tests/Support/school_business_concurrency_worker.php tests/Support/SchoolBusinessUpgradeProbe.php tests/Support/Database/MainSubscriptionBuilder.php tests/Feature/SchoolAdmin*Test.php tests/Feature/SchoolOperationalSetupGateTest.php tests/Feature/TeacherAssignmentTest.php tests/Feature/FinanceDatabaseIntegrityTest.php tests/Feature/PlatformSchoolOnboardingSecurityTest.php
      - name: Static analysis of business boundary
        run: vendor/bin/phpstan analyse --configuration=phpstan-school-business.neon --memory-limit=1G --no-progress
      - name: Fresh or upgraded HTTP and concurrency boundary tests
        run: >-
          php vendor/bin/phpunit --configuration=phpunit.xml
          tests/Feature/SchoolBusinessWriteAccessTest.php
          tests/Feature/SchoolBusinessWriteConcurrencyTest.php
      - name: Existing business and authentication regression tests
        run: >-
          php vendor/bin/phpunit --configuration=phpunit.xml
          tests/Feature/SchoolAdminLearnerAdmissionTest.php
          tests/Feature/SchoolAdminLearnerLifecycleTest.php
          tests/Feature/SchoolAdminLearnerPlacementTest.php
          tests/Feature/SchoolAdminGuardianLinkingTest.php
          tests/Feature/SchoolAdminProfileCompletionTest.php
          tests/Feature/SchoolAdminAcademicYearSetupTest.php
          tests/Feature/SchoolAdminCurrentTermSetupTest.php
          tests/Feature/SchoolAdminGradeSetupTest.php
          tests/Feature/SchoolAdminStreamSetupTest.php
          tests/Feature/TeacherAssignmentTest.php
          tests/Feature/FinanceDatabaseIntegrityTest.php
          tests/Feature/PlatformSchoolOnboardingSecurityTest.php
          tests/Feature/AssessmentReadOnlyAccessTest.php
          tests/Feature/AuthenticationContractTest.php
