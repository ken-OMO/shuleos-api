name: ShuleOS API CI

# Implements the pipeline described in docs/11-devops/CI-CD-Pipeline.md:
# Formatting -> Static Analysis / Security Scan -> Backend Tests -> Build Verification.
# A failed stage blocks merging through required branch protection checks.

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint in check mode
        run: vendor/bin/pint --test

  dependency-security-scan:
    name: Dependency and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit

  assessment-static-analysis:
    name: Assessment Static Analysis
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_DATABASE: shuleos_testing
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pgsql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify assessment analysis coverage
        run: php tools/phpstan/check-assessment-coverage.php

      - name: Verify generated analysis schema
        run: |
          php tools/phpstan/generate-schema.php
          git diff --exit-code -- tools/phpstan/schema/analysis.sql

      - name: Analyze assessment code without a baseline
        run: vendor/bin/phpstan analyse --configuration=phpstan-assessment.neon --memory-limit=1G --no-progress

  transport-static-analysis:
    name: Transport Static Analysis
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_DATABASE: shuleos_assessment_fk_test
      DB_URL: ""
      DATABASE_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BOARDING_REPORTING_SCHEDULER_ENABLED: "false"
      TRANSPORT_REPORTING_SCHEDULER_ENABLED: "false"
      TRANSPORT_REPORTING_SCHEDULER_ACTORS: "{}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pgsql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Analyze Transport code without a baseline
        run: php vendor/bin/phpstan analyse --configuration=phpstan-transport.neon --memory-limit=1G --no-progress

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs:
      - formatting
      - dependency-security-scan
      - assessment-static-analysis
      - transport-static-analysis

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shuleos
          POSTGRES_PASSWORD: shuleos
          POSTGRES_DB: shuleos_assessment_fk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shuleos"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pgsql, pdo_pgsql
          coverage: none
          ini-values: memory_limit=1G

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          APP_ENV: testing
          APP_DEBUG: false
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: shuleos_assessment_fk_test
          DB_USERNAME: shuleos
          DB_PASSWORD: shuleos
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

      - name: Run migrations against a clean PostgreSQL database
        run: php artisan migrate:fresh --force
        env:
          APP_ENV: testing
          APP_DEBUG: false
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: shuleos_assessment_fk_test
          DB_USERNAME: shuleos
          DB_PASSWORD: shuleos
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

      - name: Run backend test suite
        run: php -d memory_limit=1G vendor/bin/phpunit --configuration=phpunit.xml --stop-on-error --stop-on-failure
        env:
          APP_ENV: testing
          APP_DEBUG: false
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: shuleos_assessment_fk_test
          DB_USERNAME: shuleos
          DB_PASSWORD: shuleos
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

